name: Auto Update Game Config (Supercell DNS)
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'   # каждые 3 часа (сдвиг с парсером подписок)
  workflow_dispatch:

concurrency:
  group: game-config
  cancel-in-progress: true

jobs:
  game-config:
    name: Check & replace game servers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Python + зависимости
        run: pip install requests pysocks

      - name: 3. Устанавливаем xray
        run: |
          for i in 1 2 3; do
            curl -sfL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip && break
            sleep 3
          done
          unzip -o xray.zip xray
          chmod +x xray
          ./xray version

      - name: 4. Проверка и замена серверов в game_config.json
        run: python game/game_checker.py

      - name: 5. Коммит и пуш
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add game/game_config.json game/game_report.txt game/game_link.txt
          git commit -m "🎮 Game config: живые серверы (ping+UDP)" || echo "Изменений нет"
          git pull --rebase origin main || true
          git push origin main
