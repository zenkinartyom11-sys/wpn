name: Auto Update VLESS Config
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'   # каждый час в :07 (разгруженная минута)
  workflow_dispatch:       # кнопка ручного запуска

concurrency:
  group: parser            # не даём двум запускам пересекаться
  cancel-in-progress: true

jobs:
  run-parser:
    name: Run VLESS Parser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: 1. Клонируем репозиторий
        uses: actions/checkout@v4

      - name: 2. Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Зависимости
        run: pip install requests

      - name: 4. Устанавливаем xray (с retry)
        run: |
          for i in 1 2 3; do
            curl -sfL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip && break
            echo "retry $i..."; sleep 3
          done
          unzip -o xray.zip xray
          chmod +x xray
          ./xray version

      - name: 4b. Устанавливаем sing-box (для hysteria2 в белом списке)
        run: |
          for i in 1 2 3; do
            URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep browser_download_url | cut -d '"' -f 4 | grep 'linux-amd64.tar.gz' | grep -v android | head -1)
            [ -n "$URL" ] && curl -sfL "$URL" -o sb.tar.gz && break
            echo "retry $i..."; sleep 3
          done
          mkdir -p sbx && tar -xzf sb.tar.gz -C sbx
          find sbx -name sing-box -type f -exec mv {} sing-box \;
          rm -rf sbx sb.tar.gz
          chmod +x sing-box
          ./sing-box version

      - name: 5. Запуск парсера
        run: python checker.py

      - name: 6. Коммит и пуш (подписки + история проверок)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add white_subscription.txt black_subscription.txt proven.txt
          git commit -m "🤖 ЭтоНеЯ-списки: только живые (xray+tg+контент+скорость)" || echo "Изменений нет"
          git pull --rebase origin main || true
          git push origin main
